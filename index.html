<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akses Tautan</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* Menghilangkan scrollbar bawaan */
        }

        /* Container pembungkus untuk memotong tampilan */
        .iframe-container {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        /* Menggeser iframe ke atas agar bagian atasnya tersembunyi */
        .iframe-container iframe {
            position: absolute;
            top: -200px; /* UBAH ANGKA INI: Semakin besar minusnya, semakin banyak bagian atas yang terpotong */
            left: 0;
            width: 100%;
            height: calc(100% + 200px); /* Sesuaikan nilainya dengan nilai 'top' di atas */
            border: none;
        }
    </style>
</head>
<body>

    <!-- Container iFrame -->
    <div class="iframe-container">
        <iframe src="https://tryout.winayalaksa.id/user/dashboard"></iframe>
    </div>

</body>
</html>
