<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROCKY LINE - Portal Akses</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        /* --- 1. TAMPILAN FORM LOGIN --- */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 35px 30px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        .login-card .avatar-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px auto;
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.4);
        }
        .login-card .avatar-icon svg {
            width: 30px;
            height: 30px;
            fill: white;
        }
        .brand-title {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 2.5px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        .login-card h2 {
            margin-bottom: 25px;
            font-size: 15px;
            color: #718096;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #4a5568;
            font-size: 13px;
            font-weight: 600;
        }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
            outline: none;
            background: #f8fafc;
        }
        .form-group input:focus {
            border-color: #667eea;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }
        .password-wrapper {
            position: relative;
            width: 100%;
        }
        .password-wrapper input {
            padding-right: 42px !important;
        }
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            width: 24px;
            height: 24px;
            z-index: 10;
        }
        .toggle-password svg {
            width: 20px;
            height: 20px;
            fill: #a0aec0;
            transition: fill 0.2s;
        }
        .toggle-password:hover svg {
            fill: #667eea;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(118, 75, 162, 0.35);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(118, 75, 162, 0.45);
        }
        .btn-submit:active {
            transform: translateY(0);
        }
        .error-message {
            color: #e53e3e;
            background: #fff5f5;
            border: 1px solid #fed7d7;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            margin-top: 15px;
            display: none;
        }

        /* --- 2. DASHBOARD & PENGATURAN IFRAME --- */
        .dashboard-container {
            display: none;
            width: 100%;
            height: 100vh;
            flex-direction: column;
            background: #ffffff;
        }
        .top-bar {
            height: 55px;
            background: linear-gradient(90deg, #1a202c 0%, #2d3748 100%);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .top-bar h3 {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .btn-logout {
            background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(255, 65, 108, 0.3);
            transition: opacity 0.2s;
        }
        .btn-logout:hover {
            opacity: 0.9;
        }

        .iframe-wrapper {
            position: relative;
            flex: 1;
            overflow: hidden;
            background: #f7fafc;
        }

        /* LOADING ANIMATION AGAR TIDAK PUTIH POLOS */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 10;
            color: #4a5568;
            font-weight: 600;
            font-size: 14px;
        }
        .spinner {
            width: 35px;
            height: 35px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 12px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .iframe-wrapper iframe {
            position: absolute;
            top: -180px;
            left: -10px;
            width: 102%;
            height: calc(100% + 220px);
            border: none;
            overflow: hidden; 
        }
    </style>
</head>
<body>

    <!-- HALAMAN LOGIN -->
    <div id="loginView" class="login-container">
        <div class="login-card">
            <div class="avatar-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
            </div>
            
            <h1 class="brand-title">ROCKY LINE</h1>
            <h2>Selamat Datang</h2>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" required placeholder="Masukkan username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" required placeholder="Masukkan password">
                        <button type="button" id="togglePassword" class="toggle-password" title="Tampilkan/Sembunyikan Password">
                            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-submit">Masuk Ke Portal</button>
                <p id="errorMsg" class="error-message">Username atau password salah!</p>
            </form>
        </div>
    </div>

    <!-- HALAMAN DASHBOARD -->
    <div id="dashboardView" class="dashboard-container">
        <div class="top-bar">
            <h3 id="userGreeting">ROCKY LINE — Sesi Akses Aktif</h3>
            <button id="btnLogout" class="btn-logout">Logout</button>
        </div>
        <div class="iframe-wrapper">
            <!-- INDIKATOR LOADING -->
            <div id="loadingOverlay" class="loading-overlay">
                <div class="spinner"></div>
                <span>Memuat Halaman...</span>
            </div>
            <iframe id="mainFrame" src="" scrolling="auto"></iframe>
        </div>
    </div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        
        const USERS = [
            { username: "rocky", passEnc: "a2Fud2lscGFz" },
            { username: "rocky", passEnc: "c2Rta2Fud2ls" },
            { username: "rocky", passEnc: "YWRtaW5rYW53aWw=" },
            { username: "rocky", passEnc: "ZmF0aGFy" }
        ];

        const LINK_UTAMA = "https://tryout.winayalaksa.id/user/dashboard";

        const loginView = document.getElementById('loginView');
        const dashboardView = document.getElementById('dashboardView');
        const mainFrame = document.getElementById('mainFrame');
        const loginForm = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');
        const btnLogout = document.getElementById('btnLogout');
        const userGreeting = document.getElementById('userGreeting');
        const loadingOverlay = document.getElementById('loadingOverlay');

        const passwordInput = document.getElementById('password');
        const togglePasswordBtn = document.getElementById('togglePassword');
        const eyeIcon = document.getElementById('eyeIcon');
        const eyeOpenPath = 'M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z';
        const eyeClosePath = 'M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.44-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.17c0-1.66-1.34-3-3-3l-.17.02z';

        // PROSES HILANGKAN OVERLAY SAAT IFRAME SELESAI LOADING
        mainFrame.addEventListener('load', function() {
            loadingOverlay.style.display = 'none';
        });

        // MENAMPILKAN DASHBOARD DENGAN PENANGANAN LAZY LOAD
        function showDashboard(username) {
            userGreeting.textContent = `ROCKY LINE — Sesi Akses Aktif (${username})`;
            loginView.style.display = 'none';
            dashboardView.style.display = 'flex';
            
            // Tampilkan indikator loading tiap kali memuat
            loadingOverlay.style.display = 'flex';

            // Paksa pemuatan ulang tautan utama secara konsisten
            setTimeout(function() {
                mainFrame.src = LINK_UTAMA;
            }, 100);
        }

        // 1. CEK SESI LOGIN SAAT REFRESH
        const savedUser = localStorage.getItem('loggedInUser');
        if (savedUser) {
            showDashboard(savedUser);
        }

        // 2. TOGGLE MATA PASSWORD
        togglePasswordBtn.addEventListener('click', function() {
            const isPassword = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
            eyeIcon.querySelector('path').setAttribute('d', isPassword ? eyeClosePath : eyeOpenPath);
        });

        // 3. SUBMIT LOGIN
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const userInput = document.getElementById('username').value.trim();
            const passInput = passwordInput.value.trim();
            const encodedInput = btoa(passInput);

            const foundUser = USERS.find(u => 
                u.username === userInput && 
                (u.passEnc === encodedInput || u.passEnc === passInput)
            );

            if (foundUser) {
                errorMsg.style.display = 'none';
                localStorage.setItem('loggedInUser', foundUser.username);
                showDashboard(foundUser.username);
            } else {
                errorMsg.style.display = 'block';
            }
        });

        // 4. LOGOUT
        btnLogout.addEventListener('click', function() {
            localStorage.removeItem('loggedInUser');
            mainFrame.src = "about:blank";
            loginForm.reset();
            dashboardView.style.display = 'none';
            loginView.style.display = 'flex';
        });
    });
</script>

</body>
</html>
