<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Akses Tautan</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 350px;
        }
        .login-card h2 {
            margin-bottom: 20px;
            font-size: 20px;
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .btn-submit {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            border: none;
            color: white;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        .btn-submit:hover {
            background-color: #0056b3;
        }
        .error-message {
            color: red;
            font-size: 13px;
            margin-top: 10px;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Masuk untuk Melanjutkan</h2>
    <form id="loginForm">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" required placeholder="Masukkan username">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" required placeholder="Masukkan password">
        </div>
        <button type="submit" class="btn-submit">Masuk</button>
        <p id="errorMsg" class="error-message">Username atau password salah!</p>
    </form>
</div>

<!-- KODE JAVASCRIPT DILETAKKAN SEBELUM TUTUP BODY -->
<script>
    document.addEventListener("DOMContentLoaded", function() {
        // Setel Username, Password, dan Link Tujuan di sini
        const USERNAME_BENAR = "user123";
        const PASSWORD_BENAR = "rahasia123";
        const LINK_UTAMA = "https://tryout.winayalaksa.id/user/dashboard";

        const form = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');

        if (form) {
            form.addEventListener('submit', function(e) {
                e.preventDefault(); // Mencegah reload halaman
                
                const userInput = document.getElementById('username').value.trim();
                const passInput = document.getElementById('password').value.trim();

                // Pengecekan Login
                if (userInput === USERNAME_BENAR && passInput === PASSWORD_BENAR) {
                    errorMsg.style.display = 'none';
                    window.location.href = LINK_UTAMA;
                } else {
                    errorMsg.style.display = 'block';
                }
            });
        }
    });
</script>

</body>
</html>
